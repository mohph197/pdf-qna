name: Release

# Builds, tests and publishes a version. It runs in two ways:
#   - Automatically, called by release-please.yml after a release PR is merged.
#     release-please has already created the tag and the GitHub release, so
#     this attaches the store package to it.
#   - Manually, by pushing a tag like v1.2.0 (matching manifest.json). This
#     creates the GitHub release itself, with notes from CHANGELOG.md.
# Either way, it then uploads to the Chrome Web Store and submits for review,
# once the repository variable CWS_PUBLISH is "true" (see README).

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v1.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Test and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Tag must match manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      - name: Cache arXiv test papers
        uses: actions/cache@v6
        with:
          path: tests/papers
          key: arxiv-papers-${{ hashFiles('scripts/fetch-test-papers.sh') }}

      - run: npm run test:matcher

      - name: Build store package
        id: package
        run: |
          npm run package
          echo "file=$(ls dist/*.zip)" >> "$GITHUB_OUTPUT"

      - name: End-to-end test of the package in headless Chrome
        run: |
          unzip -q dist/*.zip -d "$RUNNER_TEMP/extension"
          npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          EXTENSION_DIR: ${{ runner.temp }}/extension

      - name: Create the GitHub release, or attach the package to it
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            version="${TAG#v}"
            awk -v v="$version" '
              $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
            gh release create "$TAG" "$FILE" --title "Paper Q&A $TAG" --notes-file notes.md --verify-tag
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error

  chrome-web-store:
    name: Publish to Chrome Web Store
    needs: release
    if: vars.CWS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: extension-package
          path: dist

      - name: Upload and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/cws-publish.mjs dist/*.zip
