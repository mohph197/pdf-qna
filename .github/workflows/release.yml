name: Release

# Push a tag like v1.2.0 (matching manifest.json's version) to:
#   1. run all tests,
#   2. create a GitHub release with the store package attached,
#   3. upload it to the Chrome Web Store and submit it for review
#      (only once the repository variable CWS_PUBLISH is "true"; see README).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Test and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      package: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Tag must match manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      - name: Cache arXiv test papers
        uses: actions/cache@v4
        with:
          path: tests/papers
          key: arxiv-papers-${{ hashFiles('scripts/fetch-test-papers.sh') }}

      - run: npm run test:matcher
      - name: Build store package
        id: package
        run: |
          npm run package
          echo "file=$(ls dist/*.zip)" >> "$GITHUB_OUTPUT"

      - name: End-to-end test of the package in headless Chrome
        run: |
          unzip -q dist/*.zip -d "$RUNNER_TEMP/extension"
          npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          EXTENSION_DIR: ${{ runner.temp }}/extension

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" \
            --title "Paper Q&A $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error

  chrome-web-store:
    name: Publish to Chrome Web Store
    needs: release
    if: vars.CWS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: dist

      - name: Upload and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/cws-publish.mjs dist/*.zip
