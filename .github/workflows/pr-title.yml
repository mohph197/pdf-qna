name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit
# message that release-please reads. Require conventional-commit titles,
# e.g. "feat: export notes as Markdown" or "fix(matcher): handle soft hyphens".

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            test
            refactor
          requireScope: false
